<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐀🐀🐀</title>
<style>
  html, body { height:100%; margin:0; overflow:hidden; background:#0d1117; }
  .col {
    position:absolute; top:0; width:20%; height:200%;
    display:flex; flex-direction:column;
    animation: scrollUp linear infinite;
    font-family: monospace;
    color:#58a6ff;
    font-weight:bold;
    white-space:nowrap;
  }
  .col span { padding: 4px 0; }
  @keyframes scrollUp {
    from { transform: translateY(0); }
    to { transform: translateY(-50%); }
  }
</style>
</head>
<body>
  <div id="field"></div>
  <script>
    const phrase = "I WAS CRAZY ONCE 🐀 THEY LOCKED ME IN A ROOM 🐀 A RUBBER ROOM 🐀 A RUBBER ROOM FULL OF RATS 🐀 RATS MAKE ME CRAZY 🐀 ";
    const field = document.getElementById('field');
    const colCount = 6;
    for (let c = 0; c < colCount; c++) {
      const col = document.createElement('div');
      col.className = 'col';
      col.style.left = (c * (100 / colCount)) + '%';
      const dir = c % 2 === 0 ? 1 : -1;
      const duration = 8 + Math.random() * 10;
      col.style.animationDuration = duration + 's';
      col.style.animationDirection = dir === 1 ? 'normal' : 'reverse';
      col.style.fontSize = (14 + Math.random() * 20) + 'px';
      let text = '';
      const repeats = 40;
      for (let i = 0; i < repeats; i++) {
        text += phrase;
      }
      const wrap1 = document.createElement('span');
      wrap1.textContent = text;
      const wrap2 = document.createElement('span');
      wrap2.textContent = text;
      col.appendChild(wrap1);
      col.appendChild(wrap2);
      field.appendChild(col);
    }
  </script>
</body>
</html>
