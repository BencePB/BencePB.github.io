<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐀🐀🐀</title>
<style>
  html, body { height:100%; margin:0; overflow:hidden; background:#0d1117; }
  .col {
    position:absolute; top:0;
    display:flex; flex-direction:column;
    animation: scrollUp linear infinite;
    font-family: monospace;
    color:#58a6ff;
    font-weight:bold;
    white-space:nowrap;
  }
  .col .block { padding: 4px 0; }
  @keyframes scrollUp {
    from { transform: translateY(0); }
    to { transform: translateY(-50%); }
  }
</style>
</head>
<body>
  <div id="field" style="position:relative; width:100%; height:100%;"></div>
  <script>
    const phrase = "I WAS CRAZY ONCE 🐀 THEY LOCKED ME IN A ROOM 🐀 A RUBBER ROOM 🐀 A RUBBER ROOM FULL OF RATS 🐀 RATS MAKE ME CRAZY 🐀 ";
    const field = document.getElementById('field');
    const colCount = 6;
    for (let c = 0; c < colCount; c++) {
      const col = document.createElement('div');
      col.className = 'col';
      col.style.left = (c * (100 / colCount)) + '%';
      const dir = c % 2 === 0 ? 'normal' : 'reverse';
      const duration = 8 + Math.random() * 10;
      col.style.animationDuration = duration + 's';
      col.style.animationDirection = dir;
      col.style.fontSize = (14 + Math.random() * 20) + 'px';
      let text = '';
      const linesNeeded = 60;
      for (let i = 0; i < linesNeeded; i++) {
        text += phrase + '\n';
      }
      const block1 = document.createElement('div');
      block1.className = 'block';
      block1.style.whiteSpace = 'pre-wrap';
      block1.textContent = text;
      const block2 = block1.cloneNode(true);
      col.appendChild(block1);
      col.appendChild(block2);
      field.appendChild(col);
    }
  </script>
</body>
</html>
